# The API and Postgres are two containers on one Compose network.
#
# Inside that network the database host is the service name `db`.
# `localhost` inside the API container is the API itself, not Postgres.
# A URL that says localhost would try to connect to the API container
# and the connection would be refused.
#
# Port 5432 is published so a terminal on the laptop can run psql and
# see the same rows the page shows. The page is not a separate copy.
#
# The pgdata volume is why a restart does not wipe the table. Seed rows
# are inserted only when the table is empty.

services:
  api:
    build: .
    ports:
      # 8000 on the laptop, 8000 in the container. If 8000 is already
      # taken, start with: API_PORT=8035 docker compose up --build
      - "${API_PORT:-8000}:8000"
    environment:
      # Hostname `db` is the Compose service below, not the laptop.
      DATABASE_URL: postgresql://postgres:devpass@db:5432/appdb
    depends_on:
      db:
        condition: service_healthy
    # Bind every interface. The default, 127.0.0.1, is the container's
    # own loopback, and the laptop cannot open that.
    command: uvicorn main:app --host 0.0.0.0 --port 8000
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # Compose starts the API only after Postgres accepts connections.
      # Without this, the first request can run before the table exists.
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
